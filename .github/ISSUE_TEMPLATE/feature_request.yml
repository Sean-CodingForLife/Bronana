name: 提建议 / 加功能
description: 玩法建议、平衡问题、要加的东西
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。但这个项目有两条会先被问到的现实，先写在这里省一轮来回：

        1. **范围很保守**。单人维护，加东西的代价要有人付。
           `README.md` 里记着大量"我想要但没做"的东西，以及**为什么没做** ——
           建议前搜一下，可能你的想法已经在里面（带结论）。
        2. **"一款游戏该有的东西"有一张验收盘**：`pnpm run kit`。
           它列了 27 项（音频槽位、本地化、存档槽位、教程、可访问性、暂停菜单…），
           每项都带判据。如果建议的是那类内容，先跑它看是"已有"还是"有意不做"。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的是什么问题
      description: |
        **请从"问题"开始，而不是从"方案"开始。**
        "商店的选择没有取舍"是问题；"加一个刷新按钮"是方案 —— 前者能讨论，后者不能。
      placeholder: |
        例：打到第 2 层之后，材料永远花不完，于是"该盖哪座产线"不再是决策。
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你的想法（可选）
      description: 如果你已经有方案，写在这里。写清它怎么解决上面那个问题。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它做法 / 为什么不用它们
      description: 这一栏很有用 —— 它说明你已经想过取舍了。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前
      options:
        - label: 我搜过 README，里面没有已经讨论过这件事
          required: true
        - label: （如果与"该有的东西"有关）我跑过 `pnpm run kit` 并看过那一项的判据
          required: false
